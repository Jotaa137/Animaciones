<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Animación</title>
<style>
  body {
    margin: 0; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #111; font-family: sans-serif;
    overflow: hidden;
  }
  .caja {
    width: 120px; height: 120px;
    background: linear-gradient(45deg, #ff0066, #ffcc00);
    animation: mover 2s ease-in-out infinite alternate;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: bold; font-size: 20px;
  }
  @keyframes mover {
    from { transform: translateX(-80px) rotate(0); border-radius: 10%; }
    to { transform: translateX(80px) rotate(360deg); border-radius: 50%; }
  }
  p {
    position: absolute; bottom: 30px; color: #888;
    animation: parpadeo 1s infinite alternate;
  }
  @keyframes parpadeo { from { opacity: 0.2; } to { opacity: 1; } }
</style>
</head>
<body>
  <div class="caja">¡Hola!</div>
  <p>Compartido por WhatsApp con GitHub Pages</p>
</body>
</html>
